[package]
name = "kaname"
version = "0.1.1"
edition = "2024"
rust-version = "1.89.0"
description = "Kaname (要) — MCP server scaffold: tool registry, response helpers, and rmcp boilerplate"
homepage = "https://github.com/pleme-io/kaname"
repository = "https://github.com/pleme-io/kaname"
readme = "README.md"
license = "MIT"
categories = ["development-tools"]
keywords = ["mcp", "rmcp", "server", "tools"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
rmcp = { version = "0.15", features = ["server", "transport-io"] }
# kotae (答え) — the typed answer a machine gives a machine.
#
# rmcp `is_error` is a BINARY flag, so a tool that found nothing, one that
# did not understand the question, and one that could not look at all all
# collapse into a single bucket. Those are three different facts and an
# agent acts differently on each. kotae carries the discriminant.
kotae = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
thiserror = "2"
